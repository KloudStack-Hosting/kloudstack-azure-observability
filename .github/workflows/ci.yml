name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: |
          find . -path ./vendor -prune -o -path ./legacy -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  standards:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: PHPCS
        run: composer run lint
      - name: PHPStan
        run: composer run analyse

  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: PHPUnit
        run: composer run test

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions must match across all declarations
        # The 1.x plugin drifted — header said 1.2.3 while the telemetry sdkVersion tag said
        # 1.1.0. This job makes that class of drift a build failure rather than a support
        # mystery, since sdkVersion is what appears in Azure.
        run: |
          set -euo pipefail
          header=$(grep -oP '^\s*\*\s*Version:\s*\K.+' kloudstack-azure-observability.php | tr -d '[:space:]')
          const=$(grep -oP "^const VERSION\s*=\s*'\K[^']+" kloudstack-azure-observability.php)
          readme=$(grep -oP '^Stable tag:\s*\K.+' readme.txt | tr -d '[:space:]')

          echo "plugin header : $header"
          echo "VERSION const : $const"
          echo "readme stable : $readme"

          # Fail loudly if any extraction came back empty.
          #
          # Without this the job passes by comparing "" to "" the moment a grep stops matching --
          # a renamed constant, a reformatted header, or grep -P being unavailable. It was found
          # exactly that way: on a machine where -P is unsupported, all three variables were empty
          # and every comparison "passed". A version check that silently verifies nothing is worse
          # than no version check, because it is trusted.
          for pair in "header:$header" "const:$const" "readme:$readme"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::Could not extract ${pair%%:*} version. The check cannot run, so it fails."
              exit 1
            fi
          done

          if [ "$header" != "$const" ]; then
            echo "::error::Plugin header version ($header) does not match the VERSION constant ($const)."
            exit 1
          fi

          # Pre-release versions are not required to match readme.txt.
          #
          # WordPress.org's Stable tag must point at a *stable* release -- it is what users are
          # served on update. A release candidate deliberately does not move it, so requiring
          # header == stable tag would force us either to skip tagging RCs or to publish an RC to
          # every existing install. Any semver pre-release suffix is exempt, not just -dev.
          case "$header" in
            *-dev|*-alpha*|*-beta*|*-rc*)
              echo "Pre-release version; readme.txt stable tag intentionally left at $readme."
              ;;
            *)
              if [ "$header" != "$readme" ]; then
                echo "::error::Plugin version ($header) does not match readme.txt stable tag ($readme)."
                exit 1
              fi
              ;;
          esac

  translations:
    name: Translation template is current
    runs-on: ubuntu-latest

    # languages/*.pot is committed so translators can work from the repo. A committed artefact that
    # nobody regenerates goes stale silently and every translation drifts with it, so the build
    # regenerates it and fails if the result differs.
    #
    # NOTE: coverage is partial by design as of 2.0.0-rc1 -- Diagnostics and the SettingsPage
    # toggle definitions are not yet wrapped. This job guards what IS extracted; it does not
    # assert that everything user-facing is translatable. See docs/I18N.md.
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and compare
        run: |
          set -euo pipefail

          # Everything runs INSIDE the container, deliberately.
          #
          # Two earlier attempts each failed on the host/container boundary: writing the
          # regenerated template to the container's own /tmp and then diffing it on the host (the
          # file is gone with the --rm container); and writing it into the mounted workspace, which
          # the container's non-root user cannot write to because the checkout is owned by the
          # runner user. Doing the whole compare in the container sidesteps both -- it writes only
          # to /tmp (always writable), reads the committed template through the read-only mount,
          # and diffs plain files so it does not depend on the shell supporting process
          # substitution.
          docker run --rm -v "$PWD":/app -w /app --entrypoint sh wordpress:cli -c '
            set -e
            wp i18n make-pot . /tmp/regenerated.pot \
              --slug=kloudstack-azure-observability \
              --domain=kloudstack-azure-observability \
              --exclude=vendor,tests,benchmark,docs,scripts,legacy,loader,node_modules \
              --allow-root

            # POT-Creation-Date changes on every run and says nothing about the content.
            grep -v "^\"POT-Creation-Date:" languages/kloudstack-azure-observability.pot > /tmp/committed.stripped
            grep -v "^\"POT-Creation-Date:" /tmp/regenerated.pot > /tmp/regenerated.stripped

            if ! diff -u /tmp/committed.stripped /tmp/regenerated.stripped; then
              echo "::error::languages/kloudstack-azure-observability.pot is out of date. Regenerate it: wp i18n make-pot . languages/kloudstack-azure-observability.pot --slug=kloudstack-azure-observability --domain=kloudstack-azure-observability --exclude=vendor,tests,benchmark,docs,scripts,legacy,loader,node_modules"
              exit 1
            fi

            echo "Translation template is current."
          '

  client-script:
    name: Rendered client script must parse as JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # The inline script is assembled from Microsoft's loader snippet plus a generated
      # invocation. PHP linting cannot see it -- the output is JavaScript -- and a syntax error
      # there kills the whole block silently: no telemetry, no server-side symptom, nothing but a
      # console error on the visitor's browser. A shipped build did exactly that.
      - name: Render and parse
        run: |
          set -euo pipefail
          php scripts/render-client-script.php > /tmp/client.js
          echo "rendered $(wc -c < /tmp/client.js) bytes"
          node --check /tmp/client.js
          echo "Rendered client script parses."
