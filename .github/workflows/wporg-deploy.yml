name: Deploy to WordPress.org

# WordPress.org SVN is a *release* system, not a development system. Nothing is developed here.
# This job takes an already-built, already-tagged GitHub release and publishes it to SVN — it
# never builds, never edits, and never reads the working tree for plugin code.
#
# It is deliberately manual. Every push to SVN rebuilds the ZIPs for *all* versions of the plugin
# and can delay updates reaching sites by up to six hours, so a release goes out once, when it is
# ready, rather than on every merge.

# Names each run in the Actions list so a rehearsal is distinguishable from the real thing at a
# glance. Every run is otherwise titled "Deploy to WordPress.org", which makes the one run that
# actually published indistinguishable from the dry runs around it — exactly the question asked
# when working out what went out and when. run-name is evaluated before the job starts, so it can
# only report the INPUT: a blank tag reads "latest" here, and the resolved version appears in the
# job summary.
run-name: >-
  ${{ inputs.dry_run && 'Dry run' || 'PUBLISH' }} · ${{ inputs.tag || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish. Leave BLANK to use the latest GitHub release.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — do everything except the SVN commit'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to WordPress.org
    runs-on: ubuntu-latest

    steps:
      # Assets are checked out from the default branch, NOT from the tag. WordPress.org serves
      # /assets live and they are not tied to a release, so the newest artwork is always the
      # correct artwork — including for a tag cut before it existed.
      - uses: actions/checkout@v5

      # Leaving the input blank resolves the newest GitHub release, so the normal case is "publish
      # what we just released" with nothing to type and nothing to mistype. An explicit tag is
      # still accepted for the unusual case of publishing something other than the newest.
      #
      # The tag is read from the environment rather than interpolated into the script: a
      # ${{ }} expansion is substituted before the shell sees it, so an input containing shell
      # metacharacters would execute rather than be compared.
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"

          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            echo "No tag given — resolved latest release: ${tag}"
          else
            echo "Tag given explicitly: ${tag}"
          fi

          case "$tag" in
            v*) ;;
            *) echo "::error::Tag must start with v (got '${tag}')."; exit 1 ;;
          esac

          # A hyphen means a prerelease (v2.1.0-rc1). These must never reach WordPress.org: users
          # would be served a release candidate as the stable version.
          #
          # This is checked on the TAG rather than trusting GitHub's prerelease flag, because
          # release.yml did not set that flag until 2026-08-15 — every RC in this repo is recorded
          # as a full release, so "latest" would happily resolve to one.
          case "$tag" in
            *-*) echo "::error::${tag} looks like a prerelease. WordPress.org serves only stable releases."; exit 1 ;;
          esac

          echo "tag=${tag}"       >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "### Publishing \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      # SVN tags are immutable — /tags/<version> is written once and never edited, because users
      # who already installed that version and any checksum taken of it both assume it cannot
      # change. Re-running the workflow for an already-published version is the one way to end up
      # attempting that, so it is refused here rather than left to the deploy action.
      - name: Refuse to republish an existing SVN tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          url="https://plugins.svn.wordpress.org/kloudstack-azure-observability/tags/${VERSION}/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          if [ "$code" = "200" ]; then
            echo "::error::tags/${VERSION} already exists on WordPress.org. Tags are immutable — ship a new version instead."
            exit 1
          fi
          echo "tags/${VERSION} does not exist yet (HTTP ${code}) — safe to publish."

      # Trunk is built from the published, checksum-verified release asset — never from a working
      # tree. The ZIP is what CI built and what the reviewer assessed; a checkout could differ by
      # a stray file, a local edit, or a changed exclude list.
      - name: Download the release asset and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          slug=kloudstack-azure-observability
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${slug}-${VERSION}.zip" \
            --pattern "${slug}-${VERSION}.zip.sha256"
          sha256sum -c "${slug}-${VERSION}.zip.sha256"
          mkdir -p build
          unzip -q "${slug}-${VERSION}.zip" -d build
          test -d "build/${slug}"

      # CI checks the repository at tag time. This checks the artifact actually being published,
      # which is what users install — the two can diverge if the wrong asset is downloaded.
      - name: The package must declare the version it is published as
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          plugin="build/kloudstack-azure-observability/kloudstack-azure-observability.php"
          readme="build/kloudstack-azure-observability/readme.txt"

          header=$(grep -oP '^\s*\*\s*Version:\s*\K.+' "$plugin" | tr -d '[:space:]')
          const=$(grep -oP "^const VERSION\s*=\s*'\K[^']+" "$plugin")
          # Stable tag decides which directory users download from. If it does not name this
          # version, WordPress.org serves something other than what we are publishing — and a
          # Stable tag pointing at a tag that does not exist falls back to trunk.
          stable=$(grep -oP '^Stable tag:\s*\K.+' "$readme" | tr -d '[:space:]')

          fail=0
          for pair in "plugin-header:${header}" "VERSION-const:${const}" "readme-stable-tag:${stable}"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$VERSION" ]; then
              echo "::error::${name} is '${value}', expected '${VERSION}'."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      # WordPress.org matches assets by filename and silently ignores anything else, so a missing
      # or misnamed file surfaces as a caption with no image on the public page rather than as an
      # error anyone would notice.
      - name: Required assets must be present and correctly named
        run: |
          set -euo pipefail
          missing=0
          for f in icon-128x128.png icon-256x256.png \
                   banner-772x250.png banner-1544x500.png \
                   screenshot-1.png screenshot-2.png; do
            if [ ! -f ".wordpress-org/${f}" ]; then
              echo "::error::.wordpress-org/${f} is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # BUILD_DIR deploys the unpacked release asset instead of the repository, which is what
      # keeps this job a publisher rather than a builder. ASSETS_DIR is copied to SVN /assets,
      # which lives outside trunk and is never part of the download.
      #
      # Pinned to a commit SHA, not @stable. This step receives SVN_USERNAME and SVN_PASSWORD as
      # environment variables on EVERY run — including a dry run, where skipping the commit is the
      # action's own choice rather than something we enforce. A mutable tag therefore means a
      # third party can change what runs with our publishing credentials, and a "dry run" that
      # reports nothing was committed would be no evidence that nothing was.
      # 54bd289 == tag 2.3.0, which is what @stable pointed at on 2026-08-14.
      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        with:
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: kloudstack-azure-observability
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_DIR: ./build/kloudstack-azure-observability
          ASSETS_DIR: .wordpress-org

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "## ${TAG} → WordPress.org"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run** — nothing was committed to SVN."
              echo ""
              echo "Re-run with \`dry_run\` unticked to publish."
            else
              echo "Published \`${VERSION}\` to trunk and \`tags/${VERSION}\`."
              echo ""
              echo "- https://wordpress.org/plugins/kloudstack-azure-observability/ (allow ~15 minutes)"
              echo "- Bump \`observability-version.txt\` in \`KloudStack ACR Images\` to \`${TAG}\`,"
              echo "  then rebuild and promote the WordPress image."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
