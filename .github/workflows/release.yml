name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a testable ZIP be produced without cutting a tag. The artifact is attached to the
  # workflow run rather than published as a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the build (e.g. 2.0.0-rc1). The commit is appended automatically.'
        required: false
        # Carries the base version so a build reports 2.0.0-dev+<sha> rather than a bare
        # "dev+<sha>", which tells you nothing about which release line it belongs to and gives
        # WordPress's version comparison nothing sensible to work with.
        default: '2.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    name: Build plugin package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # A broken build must never become a downloadable artifact — someone will install it.
      - name: Verify before packaging
        run: |
          composer run lint
          composer run analyse
          composer run test

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A tagged release is exactly its tag. Reproducible, and checked against the code below.
            version="${GITHUB_REF_NAME#v}"
          else
            # Every dispatch build gets the commit appended, because two builds from different
            # commits reporting the same version is indistinguishable from inside WordPress —
            # the diagnostics report and the sdkVersion in Azure both show only this string, so
            # without it there is no way to tell whether a fix is actually deployed.
            version="${{ github.event.inputs.version }}+${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      # A tagged release must match the version declared in the code, or a site will report a
      # version it is not running and the sdkVersion in Azure will be wrong.
      - name: Tagged version must match the plugin header
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          header=$(grep -oP "^const VERSION\s*=\s*'\K[^']+" kloudstack-azure-observability.php)
          tag="${{ steps.version.outputs.version }}"
          if [ "$header" != "$tag" ]; then
            echo "::error::Tag v${tag} does not match VERSION constant ${header}."
            exit 1
          fi

      - name: Build package
        run: |
          set -euo pipefail
          slug="kloudstack-azure-observability"
          version="${{ steps.version.outputs.version }}"

          # WordPress requires a single top-level directory named for the slug. A flat archive
          # installs as an unusable mess, and the MU-loader's hardcoded plugin path depends on
          # this name.
          mkdir -p "build/${slug}"

          rsync -a ./ "build/${slug}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude 'legacy' \
            --exclude 'loader' \
            --exclude 'scripts' \
            --exclude 'benchmark' \
            --exclude '.wordpress-org' \
            --exclude '.gitattributes' \
            --exclude '.gitignore' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml' \
            --exclude 'phpstan.neon' \
            --exclude 'phpunit.xml' \
            --exclude 'README.md' \
            --exclude 'CHANGELOG.md' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'SECURITY.md' \
            --exclude '.phpunit.result.cache' \
            --exclude '.phpcs-cache' \
            --exclude '*.zip' \
            --exclude '.DS_Store'

          # Fail loudly rather than shipping internal planning documents or dev tooling.
          for forbidden in docs tests vendor legacy benchmark .github composer.json phpunit.xml; do
            if [ -e "build/${slug}/${forbidden}" ]; then
              echo "::error::${forbidden} must not be in the distributed package."
              exit 1
            fi
          done

          # Nothing hidden should ship. A stray cache or dotfile in a plugin archive is at best
          # noise and at worst a leaked path or credential.
          if find "build/${slug}" -name '.*' -not -name '.' | grep -q .; then
            echo "::error::Hidden files found in the package:"
            find "build/${slug}" -name '.*' -not -name '.'
            exit 1
          fi

          # Stamp the resolved version into the STAGED copy, never the working tree.
          #
          # Without this the version input only named the ZIP: a file called "…-rc3.zip" still
          # reported 2.0.0-dev from inside WordPress, so successive builds were indistinguishable
          # in the diagnostics report and in Azure's sdkVersion.
          php scripts/stamp-version.php "${version}" "build/${slug}/kloudstack-azure-observability.php"

          # Verify independently of the script that wrote it. A stamp that fails silently ships a
          # package which lies about its own contents.
          stamped_header=$(grep -oP '^\s*\*\s*Version:\s*\K.+' "build/${slug}/kloudstack-azure-observability.php" | tr -d '[:space:]')
          stamped_const=$(grep -oP "^const VERSION\s*=\s*'\K[^']+" "build/${slug}/kloudstack-azure-observability.php")

          if [ "$stamped_header" != "$version" ] || [ "$stamped_const" != "$version" ]; then
            echo "::error::Version stamping failed. header='${stamped_header}' const='${stamped_const}' expected='${version}'"
            exit 1
          fi

          php -l "build/${slug}/kloudstack-azure-observability.php"
          echo "Stamped version: ${version}"

          # The plugin must be able to run from what is in the archive.
          test -f "build/${slug}/kloudstack-azure-observability.php"
          test -f "build/${slug}/readme.txt"
          test -f "build/${slug}/uninstall.php"
          test -f "build/${slug}/LICENSE"
          test -d "build/${slug}/src"

          # The ZIP is built into a separate directory so that build/ contains nothing but the
          # plugin directory. That matters for how the artifact is uploaded below.
          mkdir -p dist
          (cd build && zip -rq "../dist/${slug}-${version}.zip" "${slug}")
          (cd dist && sha256sum "${slug}-${version}.zip" > "${slug}-${version}.zip.sha256")

          echo "--- package contents ---"
          unzip -l "dist/${slug}-${version}.zip"
          echo "--- checksum ---"
          cat "dist/${slug}-${version}.zip.sha256"

      # The MU-loader ships separately: the image places it in mu-plugins/, not inside the
      # plugin directory.
      - name: Stage the must-use loader
        run: |
          mkdir -p loader-artifact
          cp loader/kloudstack-obs-loader.php loader-artifact/

      # Upload the plugin DIRECTORY, not a zip of it.
      #
      # GitHub always wraps an artifact in its own ZIP and that is not avoidable. Earlier attempts
      # fought it: a .zip inside the artifact meant the download was a zip containing a zip, and
      # uploading the wrapper to WordPress either installed the wrong plugin or failed with
      # "No valid plugins were found".
      #
      # Turning it around, the wrapper becomes the deliverable. upload-artifact uploads a
      # directory's contents relative to that directory, so pointing it at build/ -- which holds
      # nothing but kloudstack-azure-observability/ -- produces a wrapper whose root is exactly
      # that one directory.
      #
      # That is precisely what a WordPress plugin ZIP is, so the artifact downloads and installs
      # directly, with no extraction step and nothing to get wrong.
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: PLUGIN-kloudstack-azure-observability-${{ steps.version.outputs.version }}
          path: build
          retention-days: 30
          if-no-files-found: error

      # The checksummed ZIP is still built and kept, for the image build and for verifying a
      # tagged release. It is a separate artifact so it can never end up in the installable one.
      - name: Upload checksummed archive
        uses: actions/upload-artifact@v4
        with:
          name: ARCHIVE-checksummed-zip-${{ steps.version.outputs.version }}
          path: dist
          retention-days: 30
          if-no-files-found: error

      - name: Upload must-use loader
        uses: actions/upload-artifact@v4
        with:
          name: MU-LOADER-image-builds-only-${{ steps.version.outputs.version }}
          path: loader-artifact/kloudstack-obs-loader.php
          retention-days: 30
          if-no-files-found: error

      - name: Installation instructions
        run: |
          {
            echo "## Install"
            echo ""
            echo "Download **\`PLUGIN-kloudstack-azure-observability-${{ steps.version.outputs.version }}\`**"
            echo "and upload it as-is at **Plugins → Add New → Upload Plugin**."
            echo ""
            echo "**Do not extract it.** The downloaded file is already a valid WordPress plugin archive."
            echo ""
            echo "### Other artifacts"
            echo ""
            echo "| Artifact | Use |"
            echo "|---|---|"
            echo "| \`PLUGIN-…\` | Install this in WordPress. Upload the download unchanged |"
            echo "| \`ARCHIVE-checksummed-zip-…\` | The versioned ZIP and its SHA-256, for the image build |"
            echo "| \`MU-LOADER-…\` | Image builds only. Never a WordPress upload |"
            echo ""
            echo "### Before installing on a stack running 1.x"
            echo ""
            echo "The 1.x plugin is a must-use plugin and cannot be deactivated from the admin."
            echo "**Delete** \`wp-content/mu-plugins/kloudstack-appinsights.php\` via Kudu first"
            echo "(renaming it to \`.disabled\` also works, but removing it is cleaner) —"
            echo "otherwise both versions collect and Azure ingestion is charged twice."
            echo ""
            echo "After activating you should see **KloudStack Observability for Azure** in the plugin"
            echo "list and a **Tools → KloudStack Observability** menu. Then run the self-test."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Release assets attach directly with no wrapper, so the plain ZIP is correct here —
          # unlike workflow_dispatch artifacts, which GitHub always wraps.
          files: |
            dist/*.zip
            dist/*.sha256
            loader-artifact/kloudstack-obs-loader.php
          generate_release_notes: true
          body: |
            ## Installation

            **Standard plugin** — download the `.zip` and upload it under
            Plugins → Add New → Upload Plugin.

            **KloudStack managed image** — the image pins this tag, verifies the published
            SHA-256, and installs `kloudstack-obs-loader.php` into `mu-plugins/`.

            ### Before installing on a stack running 1.x

            The 1.x plugin is a must-use plugin and cannot be deactivated from the WordPress
            admin. **Delete** `wp-content/mu-plugins/kloudstack-appinsights.php` first (renaming
            it to `.disabled` also works, but removing it is cleaner) — otherwise both versions
            will collect telemetry and Azure ingestion will be charged twice.

            Verify the download:

            ```
            sha256sum -c kloudstack-azure-observability-*.zip.sha256
            ```
