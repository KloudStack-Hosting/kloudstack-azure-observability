name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, rather than a specific solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: false

  - type: markdown
    attributes:
      value: >-
        Note on scope: this plugin is deliberately for **Azure-hosted WordPress**
        and Azure Application Insights. Requests to support other APM backends or
        non-Azure hosting are usually out of scope — but describe the use case
        anyway, it helps.
