server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;

    # Keep-alive is left on so the measurement reflects how a browser and a load balancer
    # actually talk to the origin. The benchmark client opens one connection per scenario block
    # and reuses it, so TLS and TCP setup are not repeatedly charged to the sample.
    keepalive_timeout 65;

    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wp:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # The whole point of the gate is that the response arrives before telemetry is sent.
        # Buffering the response here would hide a regression: nginx would hold the body until
        # FPM finished everything, making a blocking send look instantaneous to the client.
        fastcgi_buffering off;

        # Must exceed the plugin's own transport timeout, otherwise a deliberately stalled
        # ingestion sink would show up as an nginx 504 instead of as the latency effect (or
        # absence of one) being measured.
        fastcgi_read_timeout 120s;
    }
}
